x-app: &app
  image: triagekit:local
  build: .
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 150s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &environment
    NODE_ENV: development
    DATABASE_URL: postgres://${POSTGRES_USER:-triagekit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-triagekit}
    LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-30000}
    LEASE_MS: ${LEASE_MS:-60000}
    POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-500}
    RETRY_BASE_MS: ${RETRY_BASE_MS:-1000}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    PORT: 3000
    HOST: 0.0.0.0

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triagekit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-triagekit}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    command: ["bun", "src/migrate.ts"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-triagekit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-triagekit}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *environment
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(2000)}); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    environment:
      <<: *environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    command: ["bun", "src/worker.ts"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
